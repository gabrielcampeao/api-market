name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace?schema=public&connection_limit=40&pool_timeout=30
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_TTL_DAYS: 7
      THROTTLE_TTL_MS: 60000
      THROTTLE_LIMIT: 60
      THROTTLE_AUTH_LIMIT: 20
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations (from zero via migrate deploy)
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm test -- --runInBand --coverage --coverageReporters=text --coverageReporters=json-summary

      - name: E2E tests with coverage
        run: |
          THROTTLE_LIMIT=100000 npx jest --config ./test/jest-e2e.json --runInBand \
            --coverage --coverageDirectory=coverage-e2e \
            --collectCoverageFrom='src/**/*.(t|j)s'

      - name: Merge unit + e2e coverage
        if: always()
        run: node scripts/merge-coverage.js coverage coverage-e2e coverage-merged

      - name: Check coverage thresholds
        if: always()
        run: |
          echo "=== Coverage Summary (unit + e2e merged) ==="
          if [ -f coverage-merged/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage-merged/coverage-summary.json');
              const t = c.total;
              const pct = (name, m) => t[name].pct + '%';
              console.log('Lines:      ' + pct('lines'));
              console.log('Branches:   ' + pct('branches'));
              console.log('Functions:  ' + pct('functions'));
              console.log('Statements: ' + pct('statements'));
              const fail = t.lines.pct < 50 || t.branches.pct < 50;
              if (fail) {
                console.error('Coverage below 50% threshold — CI failing.');
                process.exit(1);
              }
              console.log('Coverage meets 50% threshold.');
            "
          else
            echo "No coverage summary found"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-e2e/
            coverage-merged/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Snapshot current image for rollback
        run: |
          docker tag marketplace-api-prod-api:latest marketplace-api-prod-api:rollback \
            || echo "No previous image to snapshot (first deploy)"

      - name: Build and restart the api container
        run: docker compose --env-file "$HOME/marketplace-prod.env" -f docker-compose.prod.yml up -d --build api

      - name: Wait for readiness
        id: readiness
        run: |
          set +e
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health/ready)
            curl_exit=$?
            if [ "$curl_exit" = "0" ] && [ "$code" = "200" ]; then
              echo "Readiness OK"
              exit 0
            fi
            echo "Attempt $i: curl exit=$curl_exit http_code=$code, retrying in 5s..."
            sleep 5
          done
          set -e
          echo "Service did not become ready in time"
          exit 1

      - name: Roll back on failed readiness
        if: failure() && steps.readiness.outcome == 'failure'
        run: |
          echo "Deploy failed readiness check, rolling back to previous image"
          docker tag marketplace-api-prod-api:rollback marketplace-api-prod-api:latest
          docker compose --env-file "$HOME/marketplace-prod.env" -f docker-compose.prod.yml up -d --no-build api
