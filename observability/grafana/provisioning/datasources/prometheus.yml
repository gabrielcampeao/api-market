apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed rather than Grafana's auto-generated one — the alert rules below
    # reference this UID directly, and an auto-generated one would be a
    # different random value every time this container's SQLite state is
    # wiped (e.g. a fresh volume), silently breaking every alert query.
    uid: prometheus_ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
